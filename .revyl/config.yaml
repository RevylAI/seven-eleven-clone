project:
    id: 540e752a-a876-4bb3-96bb-731ae459e90e
session:
    idle_timeout_seconds: 1800
build:
    framework: react_native
    profiles:
        development:
            ios:
                app_id: 79d672ba-8aea-436b-bd22-5ea972c009cd
                build_commands:
                    - cd ios && if [ ! -d Pods ] || [ ! -d SevenElevenClone.xcworkspace ]; then pod install; fi && xcodebuild -workspace SevenElevenClone.xcworkspace -scheme 'SevenElevenClone' -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
                output_path: ios/build/Build/Products/Debug-iphonesimulator/*.app
            android:
                build_commands:
                    - cd android && ./gradlew assembleDebug
                output_path: android/app/build/outputs/apk/debug/app-debug.apk
        pull-request:
            ios:
                app_id: 73b0d7d9-de27-4f73-b13a-ad993dff6eb6
                image: ios-macos-26-xcode-26.2
                setup_commands:
                    - npm ci
                    - cd ios && pod install
                build_commands:
                    - xcodebuild -workspace ios/SevenElevenClone.xcworkspace -scheme SevenElevenClone -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGN_IDENTITY=- ARCHS=arm64
                output_path: ios/build/Build/Products/Release-iphonesimulator/*.app
                timeout_seconds: 1800
pr_review:
    enabled: true
    review_triggers:
        paths: []
        labels: []
        drafts: false
    build:
        kind: revyl
        profile: pull-request
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
        always_verify:
            - The app launches to the storefront with its product catalog visible, without signing in.
        system_prompt: >-
            This is a single-store demo with guest shopping. The storefront and
            cart can be exercised without credentials. Purchases are simulated.
            Verify the changed UI on the device and capture visible evidence.
            The release simulator build bundles JavaScript and does not require Metro.
    workflow_ids: []
    strict_ci_check:
        build: true
